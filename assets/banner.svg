<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" viewBox="0 0 1000 346" role="img" aria-label="AWS VPC: Two Networks That Must Talk">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f3f46"/><stop offset="1" stop-color="#0f766e"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#f9a8d4" stop-opacity=".28"/><stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="346" rx="18" fill="url(#bg)"/><rect width="1000" height="346" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#f9a8d4" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#f9a8d4" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">AWS VPC: Two Networks</text>
<text x="48" y="160" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">That Must Talk</text>
<text x="48" y="190" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Clippy&#x27;s staging and the analytics team live in two separate VPCs with</text>
<text x="48" y="212" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">overlapping habits and a deadline: the analytics server must call the</text>
<text x="48" y="234" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">staging service privately. Connect the two networks with a VPC peering</text>
<text x="48" y="256" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">connection, add the routes on both sides, open exactly one port and…</text>
<rect x="48" y="288" width="105" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#f9a8d4" stroke-opacity=".7"/><text x="62" y="309" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">60-75 min</text>
<rect x="165" y="288" width="449" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#f9a8d4" stroke-opacity=".7"/><text x="179" y="309" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: a few cents (two small servers for an hour)</text>
<g transform="translate(750,73)">
<path d="M30 150 L80 80 L140 110 L190 40" fill="none" stroke="#f9a8d4" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<circle cx="30" cy="150" r="9" fill="#1e293b" stroke="#f9a8d4" stroke-width="3"/>
<circle cx="80" cy="80" r="9" fill="#1e293b" stroke="#f9a8d4" stroke-width="3"/>
<circle cx="140" cy="110" r="9" fill="#1e293b" stroke="#f9a8d4" stroke-width="3"/>
<circle cx="190" cy="40" r="9" fill="#1e293b" stroke="#f9a8d4" stroke-width="3"/>
<circle r="7" fill="#f9a8d4"><animateMotion dur="5s" repeatCount="indefinite" path="M30 150 L80 80 L140 110 L190 40"/></circle>
<circle cx="190" cy="40" r="9" fill="none" stroke="#f9a8d4"><animate attributeName="r" values="9;22;9" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
</g>
</svg>